name: Release draft
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Verify release version
        run: python -c "import os, importlib.metadata as m; assert os.environ['RELEASE_TAG'] == 'v' + m.version('markdown-to-google-docs')"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: python -m build
      - run: python tools/build_skill.py
      - name: Create draft with tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --generate-notes
