name: Checks
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,google]"
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python tools/build_skill.py
      - name: Install built wheel and exercise CLI
        shell: bash
        run: |
          python -m venv .temp/wheel-env
          if [ "$RUNNER_OS" = Windows ]; then py=.temp/wheel-env/Scripts/python.exe; else py=.temp/wheel-env/bin/python; fi
          "$py" -m pip install dist/*.whl
          "$py" -m md2gdoc tests/fixtures/basic.md -o output/wheel.docx
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
          if-no-files-found: error
  mermaid:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install .
      - run: npm ci
      - run: python -m unittest discover -s tests/integration -v
      - run: python -m md2gdoc tests/fixtures/kitchen-sink.md -o output/kitchen-sink.docx
